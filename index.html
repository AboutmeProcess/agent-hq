<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGENT HQ - Authentic Pixel Sprites (8 Agents)</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #03050a;
            color: #d1d5db;
            font-family: 'Sukhumvit Set', 'Prompt', sans-serif;
        }
        .font-mono-code {
            font-family: 'Share Tech Mono', monospace;
        }
        .cyber-panel {
            background: rgba(10, 14, 24, 0.94);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(59, 130, 246, 0.35);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body class="min-h-screen p-3 md:p-5 flex flex-col justify-between relative overflow-x-hidden">

    <!-- MAIN WRAPPER -->
    <div class="max-w-[1700px] mx-auto w-full flex-1 flex flex-col gap-4">

        <!-- HEADER -->
        <header class="cyber-panel p-4 rounded-2xl flex flex-wrap justify-between items-center gap-4 border-l-4 border-l-blue-500">
            <div class="flex items-center gap-3.5">
                <div class="w-12 h-12 rounded-xl bg-blue-600/25 border border-blue-400 flex items-center justify-center text-blue-400 font-bold text-2xl shadow-[0_0_15px_rgba(59,130,246,0.6)]">
                    HQ
                </div>
                <div>
                    <h1 class="text-xl md:text-2xl font-bold text-white tracking-wide">
                        AGENT HQ <span class="text-xs px-2.5 py-1 rounded-lg bg-blue-900/70 text-blue-300 border border-blue-500/50 font-mono-code">PIXEL RPG SPRITE EDITION (8 AGENTS)</span>
                    </h1>
                    <p class="text-xs text-gray-400">ศูนย์บัญชาการสำนักงานเอเจนต์อัตโนมัติ (กำลังโหลดตัวละครสไตล์พิกเซลอาร์ตตามเรฟเฟอเรนซ์)</p>
                </div>
            </div>
        </header>

        <!-- MAIN DISPLAY AREA -->
        <div class="cyber-panel rounded-2xl p-2.5 relative flex-1 min-h-[520px] overflow-hidden border border-slate-700">
            <div class="absolute top-4 left-4 right-4 z-10 flex justify-between items-center pointer-events-none">
                <div class="bg-slate-900/90 backdrop-blur-md px-3.5 py-2 rounded-xl border border-blue-500/40 text-blue-300 font-bold text-xs flex items-center gap-2.5">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></span>
                    ห้องประชุมสำนักงานหลัก (สไตล์ Isometric Pixel Art RPG ตามรูปต้นแบบ)
                </div>
            </div>

            <div class="w-full h-full rounded-xl overflow-hidden bg-[#060913] relative">
                <canvas id="authenticCanvas" class="w-full h-full block cursor-pointer"></canvas>
            </div>
        </div>

    </div>

    <!-- SCRIPT ENGINE -->
    <script>
        // ข้อมูลเอเจนต์ 8 ตำแหน่ง พร้อม SeatX, SeatY
        const AGENTS_DATA = [
            { id: 1, name: "XAUUSD Grid Bot", role: "MT5 MQL5 Grid", icon: "📈", seatX: 180, seatY: 260 },
            { id: 2, name: "Captain ประกันภัย", role: "FairDee Leads", icon: "🛡️", seatX: 320, seatY: 180 },
            { id: 3, name: "Fleet Logistics", role: "Grab / Bolt / Lala", icon: "🚚", seatX: 480, seatY: 180 },
            { id: 4, name: "Solar & Energy", role: "Deye / LiFePO4", icon: "⚡", seatX: 580, seatY: 260 },
            { id: 5, name: "Take Profit Fit", role: "เดิน 1 ชม. + 10กก.", icon: "🏋️", seatX: 480, seatY: 340 },
            { id: 6, name: "Tiramisu Baker", role: "Wongnai Merchant", icon: "🍰", seatX: 320, seatY: 340 },
            { id: 7, name: "Telegram Notifier", role: "Webhook Alert", icon: "📲", seatX: 250, seatY: 220 },
            { id: 8, name: "Google Sheets Script", role: "Apps Script Auto", icon: "📊", seatX: 420, seatY: 300 }
        ];

        let canvas, ctx;
        let hologramTableImage;

        window.addEventListener('DOMContentLoaded', () => {
            canvas = document.getElementById('authenticCanvas');
            ctx = canvas.getContext('2d');
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            requestAnimationFrame(renderLoop);
        });

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
        }

        function renderLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawRoomBackground();
            drawClassicMeetingTable();
            drawAuthenticPixelCharacters(); // ฟังก์ชันโหลดภาพจริง
            requestAnimationFrame(renderLoop);
        }

        function drawRoomBackground() {
            // ฉากหลังสีน้ำเงินเข้ม
            ctx.fillStyle = "#060913";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // พื้นลายไม้แบบพิกเซล (Subtle Wood/Floor Tone)
            ctx.strokeStyle = "rgba(40, 30, 20, 0.4)";
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 50) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }
        }

        // วาดโต๊ะประชุมไม้คลาสสิกพร้อมโฮโลแกรมแสงสีฟ้า
        function drawClassicMeetingTable() {
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;

            // เงาใต้โต๊ะ
            ctx.fillStyle = "rgba(0,0,0,0.5)";
            ctx.beginPath(); ctx.ellipse(cx, cy + 20, 140, 75, 0, 0, Math.PI * 2); ctx.fill();

            // ตัวโต๊ะไม้เข้ม (Dark Wood)
            ctx.beginPath(); ctx.ellipse(cx, cy, 130, 65, 0, 0, Math.PI * 2);
            ctx.fillStyle = "#3e271a"; ctx.fill();
            ctx.strokeStyle = "#5f3c2b"; ctx.lineWidth = 3; ctx.stroke();

            // โฮโลแกรมเครือข่ายแสงสีฟ้า (glowing holographic network diagram)
            const time = Date.now() * 0.003;
            ctx.save(); ctx.translate(cx, cy); ctx.beginPath(); ctx.ellipse(0, 0, 50, 25, 0, 0, Math.PI * 2);
            ctx.strokeStyle = "rgba(6, 182, 212, 0.8)"; ctx.lineWidth = 2; ctx.stroke();
            ctx.fillStyle = "#38bdf8"; ctx.beginPath();
            ctx.arc(-20, Math.sin(time) * 5, 4, 0, Math.PI * 2); ctx.arc(20, Math.cos(time) * 5, 4, 0, Math.PI * 2); ctx.arc(0, 8, 5, 0, Math.PI * 2); ctx.fill(); ctx.restore();
        }

        // วาดตัวละครพิกเซลอาร์ต RPG สมจริงแบบเดียวกับเรฟเฟอเรนซ์
        function drawAuthenticPixelCharacters() {
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const spriteSize = 48; // ขนาดตัวละครที่เหมาะสม

            AGENTS_DATA.forEach((agent, index) => {
                // คำนวณตำแหน่งรอบโต๊ะล้อม (Elliptic placement)
                const angle = (index / AGENTS_DATA.length) * Math.PI * 2;
                const radiusX = 150;
                const radiusY = 75;
                const x = cx + Math.cos(angle) * radiusX;
                const y = cy + Math.sin(angle) * radiusY;

                agent.renderX = x;
                agent.renderY = y;

                // วาดเงาตัวละคร
                ctx.fillStyle = "rgba(0,0,0,0.4)";
                ctx.beginPath(); ctx.ellipse(x, y + 10, 15, 8, 0, 0, Math.PI * 2); ctx.fill();

                // วาดเก้าอี้สำนักงาน RPG
                ctx.fillStyle = "#1e293b";
                ctx.beginPath(); ctx.ellipse(x, y + 4, 12, 8, 0, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = "#334155"; ctx.stroke();

                // *** การโหลดภาพตัวละครจริง ***
                // 💡 เพื่อให้ตัวละครเหมือนในรูปเรฟเฟอเรนซ์ คุณต้นต้องตัดรูปตัวละครจริง
                // ทีละตัวจากรูปภาพ แล้วเซฟเป็นไฟล์ .png พื้นหลังใส ไปวางไว้ในโฟลเดอร์ index.html ครับ
                // โค้ดนี้จะจำลองตัวละครสไตล์พิกเซลแบบร่างไว้ให้ก่อน เพื่อไม่ให้เป็นกล่อง Missing Texture สีฟ้าครับ

                // -- ตัวละคร RPG แบบร่าง --
                ctx.fillStyle = index % 2 === 0 ? "#1e3a8a" : "#164e63"; // Jacket
                ctx.fillRect(x - 8, y - 10, 16, 16);
                ctx.fillStyle = agent.color; // Shirt/Acccent
                ctx.fillRect(x - 3, y - 8, 6, 10);
                ctx.fillStyle = "#fcd34d"; // Skin
                ctx.fillRect(x - 6, y - 20, 12, 10);
                ctx.fillStyle = "#0f172a"; // Hair
                ctx.fillRect(x - 7, y - 22, 14, 5);

                // Overhead Status Badge
                ctx.fillStyle = "rgba(10, 14, 24, 0.95)";
                ctx.fillRect(x - 45, y - 36, 90, 15);
                ctx.strokeStyle = agent.color; ctx.lineWidth = 1; ctx.strokeRect(x - 45, y - 36, 90, 15);
                ctx.fillStyle = "#ffffff"; ctx.font = "10px Prompt"; ctx.textAlign = "center";
                ctx.fillText(`${agent.icon} ${agent.name}`, x, y - 25);
            });
        }
    </script>
</body>
</html>

<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AGENT HQ - Executive Command Center</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap">
<style>
/* นำเข้าฟอนต์ Sukumvit / Sukumvit Tadmai และกำหนดเป็นหลัก */
@font-face {
  font-family: 'Sukumvit Tadmai';
  src: local('Sukumvit Tadmai'), local('SukumvitSet-Medium'), local('SukumvitSet-Text');
}

:root {
  color-scheme: dark;
  box-sizing: border-box;
  --bg: #060913;
  --panel-bg: rgba(15, 23, 42, 0.75);
  --panel-border: rgba(56, 189, 248, 0.2);
  --ink: #f1f5f9;
  --mut: #94a3b8;
  --accent: #38bdf8;
  --font-main: 'Sukumvit Tadmai', 'Sukumvit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
*, *::before, *::after { box-sizing: inherit; }

html, body {
  margin: 0;
  padding: 0;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: radial-gradient(circle at 50% 0%, #0f172a 0%, var(--bg) 80%);
  color: var(--ink);
  font-family: var(--font-main);
  -webkit-font-smoothing: antialiased;
}

/* APP SHELL CONTAINER */
.app-shell {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100vh;
  padding: 14px 20px;
  gap: 12px;
  max-width: 1600px;
  margin: 0 auto;
}

/* HEADER BAR */
header {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--panel-border);
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}
.brand-title {
  font-family: 'Orbitron', var(--font-main);
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 2px;
  color: #fff;
  text-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
  margin: 0;
}
.brand-sub {
  font-size: 13px;
  color: var(--mut);
  font-weight: 400;
}
.sys-status {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 600;
  color: #4ade80;
  background: rgba(74, 222, 128, 0.1);
  padding: 5px 12px;
  border-radius: 20px;
  border: 1px solid rgba(74, 222, 128, 0.3);
}
.sys-status-dot {
  width: 7px;
  height: 7px;
  background: #4ade80;
  border-radius: 50%;
  box-shadow: 0 0 8px #4ade80;
}

/* MAIN CONTENT SPLIT GRID */
main {
  flex: 1 1 auto;
  display: grid;
  grid-template-columns: 1fr 380px;
  gap: 16px;
  min-height: 0;
}

/* LEFT COLUMN: CONTROL ROOM STAGE */
.stage-container {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  border-radius: 14px;
  padding: 12px;
  box-shadow: 0 16px 32px rgba(0,0,0,0.4);
  backdrop-filter: blur(12px);
  min-height: 0;
}

.room-aspect-box {
  position: relative;
  width: 100%;
  height: 100%;
  max-width: 100%;
  max-height: 100%;
  aspect-ratio: 16 / 9; /* สัดส่วนสี่เหลี่ยมผืนผ้า 16:9 */
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 0 24px rgba(0,0,0,0.8);
}

.room-bg {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* HOTSPOTS */
.hotspot {
  position: absolute;
  transform: translate(-50%, -50%);
  cursor: pointer;
  border: none;
  background: transparent;
  padding: 0;
  z-index: 3;
}
.hotspot-ring {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 2px solid var(--c, var(--accent));
  background: rgba(6, 9, 19, 0.75);
  box-shadow: 0 0 12px var(--c, var(--accent));
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.25s ease;
}
.hotspot:hover .hotspot-ring {
  transform: scale(1.25);
  background: var(--c, var(--accent));
}
.hotspot-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #fff;
}
.hotspot-label {
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
  margin-top: 5px;
  font-family: var(--font-main);
  font-size: 11px;
  font-weight: 600;
  color: #fff;
  background: rgba(6, 9, 19, 0.88);
  padding: 2px 9px;
  border-radius: 5px;
  border: 1px solid var(--c, var(--accent));
  white-space: nowrap;
  pointer-events: none;
  box-shadow: 0 4px 10px rgba(0,0,0,0.5);
}

/* RIGHT COLUMN: SIDEBAR */
.sidebar {
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-height: 0;
}

.panel {
  background: var(--panel-bg);
  border: 1px solid var(--panel-border);
  border-radius: 14px;
  padding: 16px;
  backdrop-filter: blur(12px);
}

.panel-title {
  font-family: 'Orbitron', var(--font-main);
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 1px;
  color: var(--accent);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

/* AGENTS GRID */
.agents-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  flex: 1 1 auto;
  overflow-y: auto;
}

.agent-card-btn {
  all: unset;
  cursor: pointer;
  background: rgba(30, 41, 59, 0.4);
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-left: 3px solid var(--k, var(--accent));
  border-radius: 8px;
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  transition: all 0.2s ease;
}
.agent-card-btn:hover {
  background: rgba(51, 65, 85, 0.6);
  border-color: var(--k, var(--accent));
  transform: translateY(-2px);
}
.agent-name {
  font-weight: 600;
  font-size: 13px;
  color: var(--ink);
}
.agent-status {
  font-size: 11px;
  color: var(--mut);
}

/* LIVE LOG PANEL */
.log-panel {
  flex: 0 0 170px;
  display: flex;
  flex-direction: column;
}
.log-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
  overflow-y: auto;
}
.log-item {
  font-size: 12px;
  display: flex;
  gap: 10px;
  padding: 4px 0;
  border-bottom: 1px dashed rgba(255,255,255,0.06);
}
.log-time {
  color: var(--mut);
  font-family: monospace;
  font-size: 11px;
}

/* MODAL CARD */
#m {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(2, 6, 23, 0.85);
  backdrop-filter: blur(10px);
  z-index: 100;
  padding: 16px;
}
#m.on { display: flex; }
.modal-card {
  background: #0f172a;
  border: 1px solid var(--c, var(--accent));
  box-shadow: 0 0 32px rgba(0,0,0,0.8), 0 0 16px var(--c, var(--accent));
  border-radius: 14px;
  max-width: 420px;
  width: 100%;
  padding: 22px;
}
.modal-card h2 {
  font-family: 'Orbitron', var(--font-main);
  font-size: 18px;
  font-weight: 800;
  color: var(--c, var(--accent));
  margin: 0 0 6px;
}
.modal-role {
  color: var(--mut);
  font-size: 13px;
  font-weight: 400;
  margin-bottom: 14px;
}
.modal-desc {
  font-size: 14px;
  line-height: 1.6;
  margin-bottom: 18px;
  color: var(--ink);
}
.close-btn {
  background: var(--c, var(--accent));
  color: #020617;
  border: none;
  border-radius: 6px;
  padding: 9px 20px;
  font-family: var(--font-main);
  font-weight: 600;
  font-size: 13px;
  cursor: pointer;
  float: right;
}

/* RESPONSIVE LAYOUT */
@media (max-width: 1024px) {
  html, body { overflow: auto; }
  .app-shell { height: auto; min-height: 100vh; }
  main { grid-template-columns: 1fr; }
  .stage-container { height: 60vh; }
}
</style>
</head>
<body>

<div class="app-shell">
  <header>
    <div class="brand">
      <h1 class="brand-title">AGENT HQ</h1>
      <span class="brand-sub">ศูนย์ปฏิบัติการเอเจนต์อัจฉริยะ</span>
    </div>
    <div class="sys-status">
      <div class="sys-status-dot"></div>
      SYSTEM ONLINE
    </div>
  </header>

  <main>
    <!-- LEFT: 16:9 CONTROL ROOM STAGE -->
    <div class="stage-container">
      <div class="room-aspect-box">
        <img src="room.jpg" alt="Control Room Isometric" class="room-bg">
        <div id="hotspots-layer"></div>
      </div>
    </div>

    <!-- RIGHT: AGENT MODULES & LOGS -->
    <div class="sidebar">
      <div class="panel" style="flex: 1 1 auto; display: flex; flex-direction: column;">
        <div class="panel-title">
          <span>ACTIVE MODULES</span>
          <span style="color: var(--mut); font-weight: 400;">(8 Agents)</span>
        </div>
        <div class="agents-grid" id="modules-list"></div>
      </div>

      <div class="panel log-panel">
        <div class="panel-title">SYSTEM LOGS</div>
        <ul class="log-list" id="log"></ul>
      </div>
    </div>
  </main>
</div>

<!-- MODAL CARD -->
<div id="m" onclick="if(event.target.id==='m') closeCard()">
  <div class="modal-card" id="card">
    <h2 id="mt"></h2>
    <div class="modal-role" id="mr"></div>
    <div class="modal-desc" id="md"></div>
    <button class="close-btn" onclick="closeCard()">ปิดหน้าต่าง</button>
  </div>
</div>

<script>
const AGENTS = [
  {id:'driver',  n:'Driver', role:'Driver Intelligence Agent', d:'ช่วยวางแผนเส้นทาง ดูแลคอมมูนิตี้ The Driver Thailand', st:'ซิงก์ข้อมูลแล้ว', c:'#5ee08a', x:18, y:68},
  {id:'captain', n:'Captain', role:'Insurance CRM Agent', d:'แบรนด์ Captain ประกันภัย ดูแลพอร์ตกรมธรรม์ ใบเสนอราคา', st:'เคสวันนี้: 18', c:'#6ea8ff', x:32, y:76},
  {id:'profit',  n:'Take Profit', role:'Forex Trading Agent', d:'ดูแล EA บน MT5 กลยุทธ์ Grid Trading คู่เงิน XAUUSD', st:'EA ทำงานอยู่', c:'#ffb347', x:68, y:78},
  {id:'solar',   n:'Solar', role:'Smart Home & Solar Agent', d:'ดูแลระบบอัตโนมัติ Apple HomeKit, โซลาร์รูฟท็อป', st:'แบตเตอรี่: 94%', c:'#ffe066', x:85, y:52},
  {id:'tg',      n:'Telegram', role:'ศูนย์แจ้งเตือนกลาง', d:'รับการแจ้งเตือนจากทุกระบบ ผ่าน Webhook', st:'ออนไลน์', c:'#4fd1ff', x:50, y:52},
  {id:'health',  n:'Healthy', role:'Health Analytics Agent', d:'ติดตามผลออกกำลังกาย ลู่วิ่ง/ดัมเบลล์ โปรเจกต์ take profit', st:'สำเร็จ 3/3 วัน', c:'#ff8ad8', x:85, y:30},
  {id:'script',  n:'App Script', role:'ระบบอัตโนมัติ', d:'สคริปต์อัตโนมัติเชื่อมระบบ', st:'พร้อมใช้งาน', c:'#9b7bff', x:68, y:28},
  {id:'finance', n:'Finance', role:'Personal Finance Agent', d:'ติดตามธุรกรรม บิลชำระเงิน ธนาคาร', st:'ตรวจสอบแล้ว', c:'#f2c94c', x:32, y:28}
];

const LOGS = [
  ['10:24', '#5ee08a', 'Driver ซิงก์ข้อมูลเส้นทางสำเร็จ'],
  ['10:21', '#4fd1ff', 'Telegram ส่งการแจ้งเตือนจาก EA'],
  ['10:15', '#ffb347', 'Take Profit ตรวจ Grid XAUUSD'],
  ['10:02', '#6ea8ff', 'Captain อัปเดตเคสวันนี้']
];

function initUI() {
  const layer = document.getElementById('hotspots-layer');
  const modulesList = document.getElementById('modules-list');
  const logList = document.getElementById('log');

  AGENTS.forEach(agent => {
    // Hotspot บนรูปภาพ
    const btn = document.createElement('button');
    btn.className = 'hotspot';
    btn.style.left = agent.x + '%';
    btn.style.top = agent.y + '%';
    btn.style.setProperty('--c', agent.c);
    btn.onclick = () => openCard(agent.id);
    btn.innerHTML = `
      <div class="hotspot-ring"><div class="hotspot-dot"></div></div>
      <div class="hotspot-label">${agent.n}</div>
    `;
    layer.appendChild(btn);

    // การ์ดใน Sidebar
    const modBtn = document.createElement('button');
    modBtn.className = 'agent-card-btn';
    modBtn.style.setProperty('--k', agent.c);
    modBtn.onclick = () => openCard(agent.id);
    modBtn.innerHTML = `
      <div class="agent-name">${agent.n}</div>
      <div class="agent-status">${agent.st}</div>
    `;
    modulesList.appendChild(modBtn);
  });

  // Logs
  logList.innerHTML = LOGS.map(([time, color, msg]) => `
    <li class="log-item">
      <span class="log-time">${time}</span>
      <span style="color:${color}">${msg}</span>
    </li>
  `).join('');
}

function openCard(id) {
  const agent = AGENTS.find(a => a.id === id);
  if(!agent) return;
  const m = document.getElementById('m');
  document.getElementById('card').style.setProperty('--c', agent.c);
  document.getElementById('mt').innerText = agent.n;
  document.getElementById('mr').innerText = agent.role;
  document.getElementById('md').innerText = agent.d;
  m.classList.add('on');
}

function closeCard() {
  document.getElementById('m').classList.remove('on');
}

window.onload = initUI;
</script>

</body>
</html>

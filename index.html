<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AGENT HQ - Adaptive Layout</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+Thai:wght@400;600&display=swap">
<style>
:root {
  color-scheme: dark;
  box-sizing: border-box;
  --bg: #0a0f1f;
  --ink: #e8eefc;
  --mut: #8b97b8;
  --panel: #121a33;
  --line: #2a3560;
}
*, *::before, *::after { box-sizing: inherit; }

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden; /* ป้องกันการสกอร์ลหลักหากพื้นที่พอ */
  background: radial-gradient(ellipse at 50% 0, #16224a, var(--bg) 70%);
  color: var(--ink);
  font-family: "Noto Sans Thai", system-ui, sans-serif;
}

/* APP SHELL: ล็อกความสูงเต็มหน้าจอ */
.app-container {
  display: flex;
  flex-direction: column;
  width: 100vw;
  height: 100vh;
  padding: 12px 16px;
  gap: 10px;
  max-width: 1280px;
  margin: 0 auto;
}

header {
  flex: 0 0 auto;
  text-align: center;
}
h1 {
  font-family: "Press Start 2P", monospace;
  font-size: clamp(16px, 3vw, 28px);
  margin: 0;
  color: #cfeaff;
  text-shadow: 2px 2px 0 #1f4fa8;
}
header p {
  color: var(--mut);
  margin: 4px 0 0;
  font-size: 12px;
}

/* MAIN CONTENT AREA */
main {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-height: 0; /* สำคัญ: เพื่อให้ Flex child หดตัวตามขนาดหน้าจอได้ */
}

/* STAGE: ส่วนแสดงผลรูปห้องสี่เหลี่ยมผืนผ้า (อัตราส่วน 16:9) */
.stage-wrapper {
  flex: 1 1 auto;
  position: relative;
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 0;
}

.room-container {
  position: relative;
  width: 100%;
  height: 100%;
  max-width: 100%;
  max-height: 100%;
  aspect-ratio: 16 / 9; /* ล็อกสัดส่วนสี่เหลี่ยมผืนผ้า */
  border: 2px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
  background: #131b2e;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
}

.room-bg {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* DASHBOARD PANELS (ส่วนล่าง) */
.dashboard-panels {
  flex: 0 0 auto;
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 10px;
}

.pn {
  background: #0c1329;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 10px 12px;
  font-size: 12px;
}
.pn > b {
  font: 400 9px "Press Start 2P", monospace;
  color: #7fd4ff;
  display: block;
  margin-bottom: 8px;
}

.mrow {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
}
.mrow button {
  all: unset;
  cursor: pointer;
  background: #111a36;
  border: 1px solid var(--line);
  border-left: 3px solid var(--k);
  border-radius: 4px;
  padding: 6px 8px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  font-size: 11px;
  color: var(--mut);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.mrow button:hover { background: #18244a; }
.mrow strong { color: var(--ink); font-size: 12px; }

/* LOGS */
.log-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
  max-height: 64px;
  overflow-y: auto;
}
.log-list li {
  display: flex;
  gap: 8px;
  color: #c5cfe8;
  font-size: 11px;
}
.log-list time { color: var(--mut); }

/* HOTSPOTS */
.hotspot {
  position: absolute;
  transform: translate(-50%, -50%);
  cursor: pointer;
  border: none;
  background: transparent;
  padding: 0;
  z-index: 3;
}
.hotspot-ring {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 2px solid var(--c, #4fd1ff);
  background: rgba(10, 15, 31, 0.7);
  box-shadow: 0 0 10px var(--c, #4fd1ff);
  display: flex;
  align-items: center;
  justify-content: center;
}
.hotspot-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #fff;
}
.hotspot-label {
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
  margin-top: 2px;
  font-family: "Press Start 2P", monospace;
  font-size: 8px;
  color: #fff;
  background: rgba(10, 15, 31, 0.85);
  padding: 2px 5px;
  border-radius: 3px;
  border: 1px solid var(--c, #4fd1ff);
  white-space: nowrap;
  pointer-events: none;
}

/* RESPONSIVE FOR SMALL SCREENS */
@media (max-width: 768px) {
  html, body { overflow: auto; } /* ยอมให้สกอร์ลได้กรณีหน้าจอเล็กมากจริงๆ */
  .app-container { height: auto; min-height: 100vh; }
  .dashboard-panels { grid-template-columns: 1fr; }
  .mrow { grid-template-columns: repeat(2, 1fr); }
}

/* MODAL */
#m {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(3,6,16,.75);
  backdrop-filter: blur(4px);
  padding: 16px;
  z-index: 10;
}
#m.on { display: flex; }
.card {
  background: var(--panel);
  border: 2px solid var(--c,#4fd1ff);
  border-radius: 6px;
  max-width: 400px;
  width: 100%;
  padding: 18px;
}
.card h2 { font-family: "Press Start 2P", monospace; font-size: 13px; color: var(--c); margin: 0 0 6px; }
.card p { margin: 0 0 12px; font-size: 13px; line-height: 1.5; }
button.close-btn {
  background: var(--c, #4fd1ff);
  color: #06101f;
  border: 0;
  border-radius: 3px;
  padding: 8px 16px;
  font-weight: 600;
  cursor: pointer;
}
</style>
</head>
<body>

<div class="app-container">
  <header>
    <h1>AGENT HQ</h1>
    <p>ศูนย์ปฏิบัติการเอเจนต์อัจฉริยะ</p>
  </header>

  <main>
    <!-- ส่วนรูปภาพสี่เหลี่ยมผืนผ้า Fit หน้าจอพอดี -->
    <div class="stage-wrapper">
      <div class="room-container">
        <img src="room.jpg" alt="Control Room Isometric" class="room-bg">
        <div id="hotspots-layer"></div>
      </div>
    </div>

    <!-- แผงข้อมูลส่วนล่าง -->
    <div class="dashboard-panels">
      <div class="pn">
        <b>ACTIVE AGENTS</b>
        <div class="mrow" id="modules-list"></div>
      </div>
      <div class="pn">
        <b>SYSTEM LOG</b>
        <ul class="log-list" id="log"></ul>
      </div>
    </div>
  </main>
</div>

<!-- MODAL -->
<div id="m" onclick="if(event.target.id==='m') closeCard()">
  <div class="card" id="card">
    <h2 id="mt"></h2>
    <p id="mr" style="color:var(--mut); font-size:12px;"></p>
    <p id="md"></p>
    <button class="close-btn" onclick="closeCard()">ปิดหน้าต่าง</button>
  </div>
</div>

<script>
const AGENTS = [
  {id:'driver',  n:'Driver', role:'Driver Intelligence Agent', d:'ช่วยวางแผนเส้นทาง ดูแลคอมมูนิตี้ The Driver Thailand', st:'ซิงก์ข้อมูลแล้ว', c:'#5ee08a', x:18, y:68},
  {id:'captain', n:'Captain', role:'Insurance CRM Agent', d:'แบรนด์ Captain ประกันภัย ดูแลพอร์ตกรมธรรม์ ใบเสนอราคา', st:'เคสวันนี้: 18', c:'#6ea8ff', x:32, y:76},
  {id:'profit',  n:'Take Profit', role:'Forex Trading Agent', d:'ดูแล EA บน MT5 กลยุทธ์ Grid Trading คู่เงิน XAUUSD', st:'EA ทำงานอยู่', c:'#ffb347', x:68, y:78},
  {id:'solar',   n:'Solar', role:'Smart Home & Solar Agent', d:'ดูแลระบบอัตโนมัติ Apple HomeKit, โซลาร์รูฟท็อป', st:'แบตเตอรี่: 94%', c:'#ffe066', x:85, y:52},
  {id:'tg',      n:'Telegram', role:'ศูนย์แจ้งเตือนกลาง', d:'รับการแจ้งเตือนจากทุกระบบ ผ่าน Webhook', st:'ออนไลน์', c:'#4fd1ff', x:50, y:52},
  {id:'health',  n:'Healthy', role:'Health Analytics Agent', d:'ติดตามผลออกกำลังกาย ลู่วิ่ง/ดัมเบลล์ โปรเจกต์ take profit', st:'สำเร็จ 3/3 วัน', c:'#ff8ad8', x:85, y:30},
  {id:'script',  n:'App Script', role:'ระบบอัตโนมัติ', d:'สคริปต์อัตโนมัติเชื่อมระบบ', st:'พร้อมใช้งาน', c:'#9b7bff', x:68, y:28},
  {id:'finance', n:'Finance', role:'Personal Finance Agent', d:'ติดตามธุรกรรม บิลชำระเงิน ธนาคาร', st:'ตรวจสอบแล้ว', c:'#f2c94c', x:32, y:28}
];

const LOGS = [
  ['10:24', '#5ee08a', 'Driver ซิงก์ข้อมูลเส้นทางสำเร็จ'],
  ['10:21', '#4fd1ff', 'Telegram ส่งการแจ้งเตือนจาก EA แล้ว'],
  ['10:15', '#ffb347', 'Take Profit ตรวจสถานะ Grid XAUUSD'],
  ['10:02', '#6ea8ff', 'Captain อัปเดตเคสวันนี้']
];

function initUI() {
  const layer = document.getElementById('hotspots-layer');
  const modulesList = document.getElementById('modules-list');
  const logList = document.getElementById('log');

  AGENTS.forEach(agent => {
    // Hotspot ปุ่มกดบนรูปภาพ
    const btn = document.createElement('button');
    btn.className = 'hotspot';
    btn.style.left = agent.x + '%';
    btn.style.top = agent.y + '%';
    btn.style.setProperty('--c', agent.c);
    btn.onclick = () => openCard(agent.id);
    btn.innerHTML = `
      <div class="hotspot-ring"><div class="hotspot-dot"></div></div>
      <div class="hotspot-label">${agent.n}</div>
    `;
    layer.appendChild(btn);

    // ปุ่ม Module ในแผงล่าง
    const modBtn = document.createElement('button');
    modBtn.style.setProperty('--k', agent.c);
    modBtn.onclick = () => openCard(agent.id);
    modBtn.innerHTML = `<strong>${agent.n}</strong><span>${agent.st}</span>`;
    modulesList.appendChild(modBtn);
  });

  logList.innerHTML = LOGS.map(([time, color, msg]) => `
    <li><time>${time}</time><span style="color:${color}">${msg}</span></li>
  `).join('');
}

function openCard(id) {
  const agent = AGENTS.find(a => a.id === id);
  if(!agent) return;
  const m = document.getElementById('m');
  document.getElementById('card').style.setProperty('--c', agent.c);
  document.getElementById('mt').innerText = agent.n;
  document.getElementById('mr').innerText = agent.role;
  document.getElementById('md').innerText = agent.d;
  m.classList.add('on');
}

function closeCard() {
  document.getElementById('m').classList.remove('on');
}

window.onload = initUI;
</script>

</body>
</html>

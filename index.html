<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent HQ Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white font-sans">
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-64 bg-gray-800 p-6 flex flex-col justify-between shrink-0">
            <div>
                <h1 class="text-2xl font-bold mb-8 text-blue-400">Agent HQ</h1>
                <nav class="space-y-4">
                    <a href="#" class="block p-3 bg-blue-600 rounded-lg font-medium">Overview</a>
                    <a href="#" class="block p-3 hover:bg-gray-700 rounded-lg font-medium transition">Finance</a>
                    <a href="#" class="block p-3 hover:bg-gray-700 rounded-lg font-medium transition">Logistics</a>
                </nav>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-8 overflow-y-auto">
            <header class="mb-8">
                <h2 class="text-3xl font-bold">Dashboard Overview</h2>
                <p class="text-gray-400 mt-1">ยินดีต้อนรับเข้าสู่ระบบจัดการข้อมูล</p>
            </header>

            <!-- Cards Grid -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-gray-800 p-6 rounded-xl border border-gray-700">
                    <h3 class="text-gray-400 text-sm font-medium">ภาพรวมระบบ</h3>
                    <p class="text-2xl font-bold mt-2 text-green-400">ปกติ (Online)</p>
                </div>
                <div class="bg-gray-800 p-6 rounded-xl border border-gray-700">
                    <h3 class="text-gray-400 text-sm font-medium">รายการที่รอดำเนินการ</h3>

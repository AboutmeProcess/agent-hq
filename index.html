<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AGENT HQ - Control Room UI</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+Thai:wght@400;600&display=swap">
<style>
:root{
  color-scheme:dark;
  box-sizing:border-box;
  --bg:#0a0f1f;
  --ink:#e8eefc;
  --mut:#8b97b8;
  --panel:#121a33;
  --line:#2a3560;
}
*,*::before,*::after{box-sizing:inherit}
body{
  margin:0;
  min-height:100vh;
  background:radial-gradient(ellipse at 50% 0,#16224a,var(--bg) 60%);
  color:var(--ink);
  font-family:"Noto Sans Thai",system-ui,sans-serif;
}
header{padding:20px 16px 8px;text-align:center}
h1{
  font-family:"Press Start 2P",monospace;
  font-size:clamp(20px,5vw,36px);
  margin:0;
  letter-spacing:2px;
  color:#cfeaff;
  text-shadow:3px 3px 0 #1f4fa8,6px 6px 0 #0a1a40;
}
header p{color:var(--mut);margin:10px 0 0;font-size:14px}
main{max-width:1000px;margin:0 auto;padding:8px 12px 28px}

.room-container {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 10;
  border: 2px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 12px 32px rgba(0,0,0,0.6);
  background: #131b2e;
}

.room-bg {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* CHARACTER SPRITE OVERLAY ON MAP */
.agent-character {
  position: absolute;
  transform: translate(-50%, -85%);
  pointer-events: none;
  z-index: 2;
}

.agent-character img {
  height: 72px; /* ขนาดของสไปรท์ตัวละคร */
  width: auto;
  image-rendering: pixelated;
  filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6));
}

/* HOTSPOT BUTTONS */
.hotspot {
  position: absolute;
  transform: translate(-50%, -50%);
  cursor: pointer;
  z-index: 3;
  border: none;
  background: transparent;
  padding: 0;
  outline: none;
}

.hotspot-ring {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 2px solid var(--c, #4fd1ff);
  background: rgba(10, 15, 31, 0.65);
  box-shadow: 0 0 12px var(--c, #4fd1ff);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.2s, background 0.2s;
}

.hotspot:hover .hotspot-ring,
.hotspot:focus-visible .hotspot-ring {
  transform: scale(1.25);
  background: var(--c, #4fd1ff);
}

.hotspot-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #fff;
  animation: pulse 1.5s infinite;
}

.hotspot-label {
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
  margin-top: 4px;
  font-family: "Press Start 2P", monospace;
  font-size: 9px;
  color: #fff;
  background: rgba(10, 15, 31, 0.85);
  padding: 3px 6px;
  border-radius: 3px;
  border: 1px solid var(--c, #4fd1ff);
  white-space: nowrap;
  pointer-events: none;
  text-shadow: 1px 1px 0 #000;
}

@keyframes pulse {
  50% { opacity: 0.3; }
}

.hint{text-align:center;color:var(--mut);font-size:13px;margin:12px 0 16px}

.hq{display:grid;gap:12px;margin:0 0 14px}
.pn{background:#0c1329;border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.pn>b{font:400 9px "Press Start 2P",monospace;color:#7fd4ff;display:block;margin-bottom:10px}
.mrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.mrow button{
  all:unset;
  cursor:pointer;
  background:#111a36;
  border:1px solid var(--line);
  border-left:3px solid var(--k);
  border-radius:4px;
  padding:8px 10px;
  display:grid;
  gap:2px;
  font-size:12px;
  color:var(--mut);
}
.mrow button:hover,.mrow button:focus-visible{background:#18244a;outline:2px solid var(--k)}
.mrow strong{color:var(--ink);font-size:13px}
.mrow i{display:inline-block;width:7px;height:7px;background:var(--k);margin-right:6px;border-radius:50%}

.log{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px;font-size:13px}
.log b{font-family:"Press Start 2P",monospace;font-size:10px;font-weight:400;color:#7fd4ff}
.log ul{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.log li{display:flex;gap:10px;color:#c5cfe8}
.log time{color:var(--mut);min-width:52px}
.log i{width:8px;height:8px;margin-top:6px;flex:none;border-radius:50%}

#m{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(3,6,16,.75);
  backdrop-filter:blur(4px);
  padding:16px;
  z-index:10;
}
#m.on{display:flex}
.card{
  background:var(--panel);
  border:2px solid var(--c,#4fd1ff);
  box-shadow:6px 6px 0 rgba(0,0,0,.5);
  border-radius:6px;
  max-width:440px;
  width:100%;
  padding:20px;
  display:flow-root;
}
#mi{
  height:110px;
  width:auto;
  float:right;
  margin:0 0 8px 12px;
  image-rendering:pixelated;
  border-radius:4px;
}
.card h2{font-family:"Press Start 2P",monospace;font-size:14px;line-height:1.5;margin:0 0 6px;color:var(--c)}
.card .r{color:var(--mut);font-size:13px;margin:0 0 12px}
.card p{margin:0 0 14px;line-height:1.7;font-size:14px}
.card .s{display:inline-block;background:#0a0f1f;border:1px solid var(--c);padding:4px 10px;font-size:13px;margin-bottom:16px;border-radius:3px}
button.close-btn{
  font:inherit;
  background:var(--c,#4fd1ff);
  color:#06101f;
  border:0;
  border-radius:3px;
  padding:9px 18px;
  font-weight:600;
  cursor:pointer;
}
</style>
</head>
<body>

<header>
  <h1>AGENT HQ</h1>
  <p>ศูนย์ปฏิบัติการเอเจนต์อัจฉริยะ (Isometric Control Room)</p>
</header>

<main>
  <div class="room-container" id="room">
    <img src="room.jpg" alt="Control Room Isometric" class="room-bg">
    <div id="characters-layer"></div>
    <div id="hotspots-layer"></div>
  </div>

  <p class="hint">แตะที่โหนดบนโต๊ะทำงานในห้อง หรือเลือกแถบระบบเพื่อตรวจสอบสถานะ</p>

  <section class="hq" aria-label="แผงสถานะ">
    <div class="pn">
      <b>ACTIVE AGENTS</b>
      <div class="mrow" id="modules-list"></div>
    </div>
  </section>

  <section class="log" aria-label="บันทึกระบบ">
    <b>SYSTEM LOG</b>
    <ul id="log"></ul>
  </section>
</main>

<div id="m" role="dialog" aria-modal="true" aria-labelledby="mt">
  <div class="card" id="card">
    <img id="mi" alt="" hidden>
    <h2 id="mt"></h2>
    <p class="r" id="mr"></p>
    <p id="md"></p>
    <span class="s" id="ms"></span>
    <br>
    <button class="close-btn" onclick="closeCard()">ปิดหน้าต่าง</button>
  </div>
</div>

<script>
// รูปตัวละคร Driver นั่งพิมพ์งาน (Data URI แบบไม่มีพื้นหลัง)

/I2O63p5639f7v39w9wunfnb0lA7Ue9+Svt+/mE0/fO34m3sbfO10//35iO++fn2fXfev+w/tq30pU58b3Ofe3ve03d4zL3T54L87e3/9/m1H1v37+S2H/+/o50+mX6s1d/uS4f54I3/P/9sByK+0/x8/42bOefE1v3eG3/iTr21p3dr+tT/c2vP7Hw3e/tT8/yv9R76y4Sfj4np18f/f3t72tX3xT/3fAUB+4eXo0Xf33m13f2D3vv1H77421H7o+f84APk/9p019s9938eAAn/83/8fAAn735I7a637/sA39v91ALa/M/6Xff7uAf3/MAB7v//25B81X4f7f6v79//o/w/M8S9A1zX8UAAAAABJRU5ErkJggg==";

const AGENTS = [
  {id:'driver',  n:'Driver', role:'Driver Intelligence Agent', d:'ช่วยวางแผนเส้นทาง ดูแลคอมมูนิตี้ The Driver Thailand และข้อมูลงานขับรถรับจ้าง', st:'ซิงก์ข้อมูลแล้ว', c:'#5ee08a', x:18, y:68, sprite: DRIVER_SITTING_SPRITE},
  {id:'captain', n:'Captain', role:'Insurance CRM Agent', d:'แบรนด์ Captain ประกันภัย ดูแลพอร์ตกรมธรรม์ ทำใบเสนอราคา และประสานงานนายหน้า', st:'เคสวันนี้: 18', c:'#6ea8ff', x:32, y:76},
  {id:'profit',  n:'Take Profit', role:'Forex Trading Agent', d:'ดูแล EA บน MT5 กลยุทธ์ Grid Trading คู่เงิน XAUUSD และระบบ Partial Hedging', st:'EA ทำงานอยู่', c:'#ffb347', x:68, y:78},
  {id:'solar',   n:'Solar', role:'Smart Home & Solar Agent', d:'ดูแลระบบอัตโนมัติ Apple HomeKit, โซลาร์รูฟท็อป, อินเวอร์เตอร์ และพลังงาน', st:'แบตเตอรี่: 94%', c:'#ffe066', x:85, y:52},
  {id:'tg',      n:'Telegram', role:'ศูนย์แจ้งเตือนกลาง', d:'รับการแจ้งเตือนจากทุกระบบ รวมถึงสัญญาณจาก EA ผ่าน Webhook', st:'ออนไลน์', c:'#4fd1ff', x:50, y:52},
  {id:'health',  n:'Healthy', role:'Health Analytics Agent', d:'บันทึกและติดตามผลออกกำลังกาย เช่น เดินลู่วิ่งและเล่นดัมเบลล์ ในโปรเจกต์ take profit', st:'สำเร็จ 3/3 วัน', c:'#ff8ad8', x:85, y:30},
  {id:'script',  n:'App Script', role:'ระบบอัตโนมัติ', d:'สคริปต์อัตโนมัติที่เชื่อมงานและการประมวลผลต่างๆ เข้าด้วยกัน', st:'พร้อมใช้งาน', c:'#9b7bff', x:68, y:28},
  {id:'finance', n:'Finance', role:'Personal Finance Agent', d:'ติดตามธุรกรรม การโอนเงิน บิลชำระเงิน และความเคลื่อนไหวผ่านแอปธนาคาร', st:'ตรวจสอบแล้ว', c:'#f2c94c', x:32, y:28}
];

const LOGS = [
  ['10:24', '#5ee08a', 'Driver ซิงก์ข้อมูลเส้นทางสำเร็จ'],
  ['10:21', '#4fd1ff', 'Telegram ส่งการแจ้งเตือนจาก EA แล้ว'],
  ['10:15', '#ffb347', 'Take Profit ตรวจสถานะ Grid XAUUSD'],
  ['10:02', '#6ea8ff', 'Captain อัปเดตเคสวันนี้']
];

const AVATAR_IMG = {
  "driver": DRIVER_SITTING_SPRITE
};

function initUI() {
  const charsLayer = document.getElementById('characters-layer');
  const layer = document.getElementById('hotspots-layer');
  const modulesList = document.getElementById('modules-list');
  const logList = document.getElementById('log');

  AGENTS.forEach(agent => {
    // Render ตัวละครบนโต๊ะทำงาน
    if (agent.sprite) {
      const charDiv = document.createElement('div');
      charDiv.className = 'agent-character';
      charDiv.style.left = agent.x + '%';
      charDiv.style.top = agent.y + '%';
      charDiv.innerHTML = `<img src="${agent.sprite}" alt="${agent.n}">`;
      charsLayer.appendChild(charDiv);
    }

    // Render โหนด Hotspot
    const btn = document.createElement('button');
    btn.className = 'hotspot';
    btn.style.left = agent.x + '%';
    btn.style.top = agent.y + '%';
    btn.style.setProperty('--c', agent.c);
    btn.onclick = () => openCard(agent.id);

    btn.innerHTML = `
      <div class="hotspot-ring">
        <div class="hotspot-dot"></div>
      </div>
      <div class="hotspot-label">${agent.n}</div>
    `;
    layer.appendChild(btn);

    // Render ปุ่ม Module
    const modBtn = document.createElement('button');
    modBtn.style.setProperty('--k', agent.c);
    modBtn.onclick = () => openCard(agent.id);
    modBtn.innerHTML = `<strong><i></i>${agent.n}</strong>${agent.st}`;
    modulesList.appendChild(modBtn);
  });

  logList.innerHTML = LOGS.map(([time, color, msg]) => `
    <li>
      <time>${time}</time>
      <i style="background:${color}"></i>
      <span>${msg}</span>
    </li>
  `).join('');
}

function openCard(id) {
  const agent = AGENTS.find(a => a.id === id);
  if(!agent) return;
  
  const m = document.getElementById('m');
  const card = document.getElementById('card');
  const mi = document.getElementById('mi');
  
  card.style.setProperty('--c', agent.c);
  document.getElementById('mt').innerText = agent.n;
  document.getElementById('mr').innerText = agent.role;
  document.getElementById('md').innerText = agent.d;
  document.getElementById('ms').innerText = `สถานะ: ${agent.st}`;
  
  if (AVATAR_IMG[id]) {
    mi.src = AVATAR_IMG[id];
    mi.hidden = false;
  } else {
    mi.hidden = true;
  }
  
  m.classList.add('on');
}

function closeCard() {
  document.getElementById('m').classList.remove('on');
}

document.getElementById('m').addEventListener('click', (e) => {
  if (e.target.id === 'm') closeCard();
});

window.onload = initUI;
</script>

</body>
</html>
